document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

oAdminCargar}}\" style=\"{{btnToolbar_cargar}}\">Cargar jugada<\u002Fbutton>\n      <button sc-camel-on-click=\"{{goAdminSorteo}}\" style=\"{{btnToolbar_sorteo}}\">Cargar sorteo<\u002Fbutton>\n      <button sc-camel-on-click=\"{{goAdminReportes}}\" style=\"{{btnToolbar_reportes}}\">Reportes<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"width:390px;max-width:100%;height:800px;background:#f4f3ee;border-radius:32px;box-shadow:0 30px 60px -20px rgba(16,32,26,.35),0 0 0 8px #10201a;position:relative;overflow:hidden;\">\n\n    <div style=\"position:absolute;inset:0;overflow-y:auto;padding-bottom:{{scrollPadding}}px;\">\n\n      <sc-if value=\"{{isLogin}}\" hint-placeholder-val=\"{{true}}\">\n        <main style=\"min-height:800px;background:#0d4a2d;display:flex;flex-direction:column;justify-content:center;padding:36px 22px;position:relative;box-sizing:border-box;\">\n          <div style=\"position:absolute;inset:0;background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.04) 0 1px,transparent 1px 12px);pointer-events:none;\"><\u002Fdiv>\n          <div style=\"position:relative;\">\n            <h1 style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:32px;line-height:1.05;letter-spacing:-.035em;color:#fff;margin:0 0 6px;\">Decena<span style=\"display:block;color:#f2d382;\">de Oro<\u002Fspan><\u002Fh1>\n            <p style=\"color:rgba(255,255,255,.68);font-size:14px;margin:0 0 22px;\">Quiniela Nocturna de Tucumán<\u002Fp>\n\n            <form sc-camel-on-submit=\"{{onLogin}}\" style=\"background:#fff;border-radius:14px;padding:22px 18px;box-shadow:0 24px 48px -24px rgba(0,0,0,.5);\">\n              <label style=\"font-size:13px;font-weight:600;color:#4b5b54;display:block;margin-bottom:6px;\">Usuario o DNI<\u002Flabel>\n              <input value=\"{{usuario}}\" sc-camel-on-change=\"{{setUsuario}}\" placeholder=\"Tu usuario o DNI\" style=\"width:100%;min-height:48px;border-radius:10px;border:1.5px solid #cbc8bc;font-size:16px;padding:10px 14px;margin-bottom:16px;box-sizing:border-box;font-family:'Sora',sans-serif;\">\n\n              <label style=\"font-size:13px;font-weight:600;color:#4b5b54;display:block;margin-bottom:6px;\">Contraseña<\u002Flabel>\n              <div style=\"display:flex;gap:8px;margin-bottom:8px;\">\n                <input type=\"{{passwordType}}\" placeholder=\"••••••\" style=\"flex:1;min-width:0;min-height:48px;border-radius:10px;border:1.5px solid #cbc8bc;font-size:16px;padding:10px 14px;box-sizing:border-box;font-family:'Sora',sans-serif;\">\n                <button type=\"button\" sc-camel-on-click=\"{{togglePassword}}\" aria-label=\"Mostrar contraseña\" style=\"min-height:48px;min-width:48px;border:1.5px solid #cbc8bc;border-radius:10px;background:#fff;color:#4b5b54;\">\n                  <i class=\"bi bi-eye\"><\u002Fi>\n                <\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#4b5b54;margin-bottom:20px;\">Si sos cliente, tu contraseña es tu DNI. Probá con \"admin\" para ver el panel de staff.<\u002Fdiv>\n\n              <button type=\"submit\" style=\"width:100%;min-height:48px;border-radius:10px;background:#14663f;border:none;color:#fff;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;\">\n                <i class=\"bi bi-box-arrow-in-right\"><\u002Fi> Ingresar\n              <\u002Fbutton>\n            <\u002Fform>\n\n            <p style=\"text-align:center;margin:18px 0 4px;color:rgba(255,255,255,.7);font-size:13.5px;\">¿Todavía no jugaste? <span style=\"text-decoration:underline;\">Registrate acá<\u002Fspan>.<\u002Fp>\n            <p style=\"text-align:center;margin:0;color:rgba(255,255,255,.75);font-size:12.5px;\">¿No podés entrar? <span style=\"text-decoration:underline;\">Hablá con Decena de Oro<\u002Fspan>.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fmain>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{isClienteScreen}}\" hint- lor:#4b5b54;margin:0 0 10px;\">Al guardar, el sistema compara estos 20 números contra todas las jugadas activas del ciclo.<\u002Fp>\n            <div style=\"background:#fbf3dd;border:1px solid #e8d6a4;border-radius:10px;padding:10px 12px;font-size:13px;color:#7a5a0d;\"><i class=\"bi bi-exclamation-triangle-fill\"><\u002Fi> Revisá bien los números: si hay ganador, el pozo se liquida y el ciclo se cierra.<\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fmain>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{isAdminReportes}}\" hint-placeholder-val=\"{{false}}\">\n        <main style=\"max-width:720px;margin:0 auto;padding:16px 16px 24px;\">\n          <button sc-camel-on-click=\"{{goAdminTablero}}\" style=\"min-height:36px;padding:0 12px;border-radius:8px;border:1px solid #cbc8bc;background:#fff;color:#4b5b54;font-size:13px;margin-bottom:12px;\"><i class=\"bi bi-arrow-left\"><\u002Fi> Tablero<\u002Fbutton>\n\n          <h1 style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:22px;margin:0;letter-spacing:-.02em;\">Reportes<\u002Fh1>\n          <div style=\"display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:#e6f1eb;color:#0d4a2d;font-size:12px;font-weight:600;margin:10px 0 16px;\"><i class=\"bi bi-globe2\"><\u002Fi> Vista global<\u002Fdiv>\n\n          <span style=\"font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8b9a93;display:block;margin-bottom:8px;\">Recaudación histórica<\u002Fspan>\n          <div style=\"background:#fff;border:1px solid #e2e0d8;border-radius:10px;padding:14px;margin-bottom:8px;\">\n            <div style=\"font-family:'Space Grotesk',monospace;font-weight:700;font-size:24px;\">$1.240.000<\u002Fdiv>\n            <div style=\"font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#8b9a93;margin-top:4px;\">Recaudado en total<\u002Fdiv>\n            <div style=\"font-size:12px;color:#4b5b54;margin-top:6px;\">312 jugadas · 64 clien color:#4b5b54;\">máx $184.000<\u002Fspan>\n          <\u002Fdiv>\n\n          <sc-for list=\"{{barrasCiclo}}\" as=\"b\" hint-placeholder-count=\"3\">\n            <div style=\"background:#fff;border:1px solid #e2e0d8;border-radius:10px;padding:12px;margin-bottom:8px;\">\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline;font-size:14px;\"><span style=\"font-weight:600;\">Ciclo {{b.numero}} <span style=\"font-weight:400;color:#4b5b54;\">· {{b.fechas}}<\u002Fspan><\u002Fspan><span style=\"font-family:'Space Grotesk',monospace;font-weight:700;\">{{b.monto}}<\u002Fspan><\u002Fdiv>\n              <div style=\"position:relative;height:10px;margin-top:8px;border-radius:999px;background:#eceae3;overflow:hidden;\"><div style=\"position:absolute;inset:0 auto 0 0;border-radius:0 999px 999px 0;background:{{b.color}};width:{{b.ancho}};\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;align-items:center;margin-top:8px;\"><span style=\"font-size:12.5px;color:#4b5b54;\">{{b.jugadas}} jugadas<\u002Fspan><span style=\"{{b.etiquetaStyle}}\">{{b.etiquetaTexto}}<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n\n          <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:14px;\">\n            <button style=\"min-height:44px;border-radius:10px;border:1.5px solid #cbc8bc;background:#fff;color:#4b5b54;font-weight:600;font-size:14px;\"><i class=\"bi bi-ticket-perforated\"><\u002Fi> Detalle de jugadas<\u002Fbutton>\n            <button style=\"min-height:44px;border-radius:10px;border:1.5px solid #cbc8bc;background:#fff;color:#4b5b54;font-weight:600;font-size:14px;\"><i class=\"bi bi-trophy\"><\u002Fi> Ganadores<\u002Fbutton>\n            <button style=\"min-height:44px;border-radius:10px;border:1.5px solid #cbc8bc;background:#fff;color:#4b5b54;font-weight:600;font-size:14px;\"><i class=\"bi bi-clock-history\"><\u002Fi> Auditoría: quién cargó qué<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fmain>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n\n    <sc-if value=\"{{showClienteNav}}\" hint-placeholder-val=\"{{false}}\">\n      <nav style=\"position:absolute;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid #e2e0d8;\">\n        <button sc-camel-on-click=\"{{goPortal}}\" style=\"{{navClienteItemStyle_portal}}\"><i class=\"bi bi-ticket-perforated\" style=\"font-size:20px;\"><\u002Fi><span style=\"font-size:11px;font-weight:600;\">Mis jugadas<\u002Fspan><\u002Fbutton>\n        <button sc-camel-on-click=\"{{goJugar}}\" style=\"{{navClienteItemStyle_jugar}}\"><i class=\"bi bi-plus-circle-fill\" style=\"font-size:20px;\"><\u002Fi><span style=\"font-size:11px;font-weight:600;\">Jugar<\u002Fspan><\u002Fbutton>\n        <button sc-camel-on-click=\"{{goHistorial}}\" style=\"{{navClienteItemStyle_historial}}\"><i class=\"bi bi-clock-history\" style=\"font-size:20px;\"><\u002Fi><span style=\"font-size:11px;font-weight:600;\">Historial<\u002Fspan><\u002Fbutton>\n      <\u002Fnav>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{showStaffNav}}\" hint-placeholder-val=\"{{false}}\">\n      <nav style=\"position:absolute;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid #e2e0d8;\">\n        <button sc-camel-on-click=\"{{goAdminTablero}}\" style=\"{{navStaffItemStyle_tablero}}\"><i class=\"bi bi-grid-1x2\" style=\"font-size:19px;\"><\u002Fi><span style=\"font-size:10.5px;font-weight:600;\">Tablero<\u002Fspan><\u002Fbutton>\n        <button sc-camel-on-click=\"{{noDisponible}}\" style=\"{{navStaffItemStyle_disabled}}\"><i class=\"bi bi-ticket-perforated\" style=\"font-size:19px;\"><\u002Fi><span style=\"font-size:10.5px;font-weight:600;\">Jugadas<\u002Fspan><\u002Fbutton>\n        <button sc-camel-on-click=\"{{goAdminCargar}}\" style=\"{{navStaffItemStyle_normal}}\"><i class=\"bi bi-plus-circle-fill\" style=\"font-size:19px;\"><\u002Fi><span style=\"font-size:10.5px;font-weight:600;\">Cargar<\u002Fspan><\u002Fbutton>\n        <button sc-camel-on-click=\"{{goAdminSorteo}}\" style=\"{{navStaffItemStyle_normal}}\"><i class=\"bi bi-dice-5\" style=\"font-size:19px;\"><\u002Fi><span style=\"font-size:10.5px;font-weight:600;\">Sorteos<\u002Fspan><\u002Fbutton>\n        <button sc-camel-on-click=\"{{noDisponible}}\" style=\"{{navStaffItemStyle_disabled}}\"><i class=\"bi bi-people\" style=\"font-size:19px;\"><\u002Fi><span style=\"font-size:10.5px;font-weight:600;\">Clientes<\u002Fspan><\u002Fbutton>\n      <\u002Fnav>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{showAccionJugar}}\" hint-placeholder-val=\"{{false}}\">\n      <div style=\"position:absolute;left:0;right:0;bottom:0;background:rgba(244,243,238,.96);backdrop-filter:blur(8px);border-top:1px solid #e2e0d8;padding:12px 16px;display:flex;align-items:center;gap:12px;\">\n        <div style=\"text-align:center;white-space:nowrap;\"><div style=\"font-family:'Space Grotesk',monospace;font-weight:700;font-size:20px;color:{{contadorJugadaColor}};\">{{contadorJugadaTexto}}<\u002Fdiv><div style=\"font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#8b9a93;\">números<\u002Fdiv><\u002Fdiv>\n        <button sc-camel-on-click=\"{{onGenerarCodigo}}\" disabled=\"{{!jugadaListaParaEnviar}}\" style=\"{{btnConfirmarJugarStyle}}\"><i class=\"bi bi-check-lg\"><\u002Fi> Generar código<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{showAccionAdminCargar}}\" hint-placeholder-val=\"{{false}}\">\n      <div style=\"position:absolute;left:0;right:0;bottom:0;background:rgba(244,243,238,.96);backdrop-filter:blur(8px);border-top:1px solid #e2e0d8;padding:12px 16px;display:flex;align-items:center;gap:12px;\">\n        <div style=\"text-align:center;white-space:nowrap;\"><div style=\"font-family:'Space Grotesk',monospace;font-weight:700;font-size:20px;color:{{contadorAdminColor}};\">{{contadorAdminTexto}}<\u002Fdiv><div style=\"font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#8b9a93;\">números<\u002Fdiv><\u002Fdiv>\n        <button sc-camel-on-click=\"{{onConfirmarCobro}}\" disabled=\"{{!confirmarAdminHabilitado}}\" style=\"{{btnConfirmarAdminStyle}}\"><i class=\"bi bi-check-lg\"><\u002Fi> Confirmar y cobrar $3.000<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{showAccionAdminSorteo}}\" hint-placeholder-val=\"{{false}}\">\n      <div style=\"position:absolute;left:0;right:0;bottom:0;background:rgba(244,243,238,.96);backdrop-filter:blur(8px);border-top:1px solid #e2e0d8;padding:12px 16px;display:flex;align-items:center;gap:12px;\">\n        <div style=\"text-align:center;white-space:nowrap;\"><div style=\"font-family:'Space Grotesk',monospace;font-weight:700;font-size:20px;color:{{contadorExtractoColor}};\">{{contadorExtractoTexto}}<\u002Fdiv><div style=\"font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#8b9a93;\">premios<\u002Fdiv><\u002Fdiv>\n        <button sc-camel-on-click=\"{{onGuardarSorteo}}\" disabled=\"{{!extractoListaParaEnviar}}\" style=\"{{btnConfirmarSorteoStyle}}\"><i class=\"bi bi-check-lg\"><\u002Fi> Guardar y cotejar<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    modo: 'cliente',\n    screen: 'login',\n    usuario: '',\n    passwordVisible: false,\n    numJugada: Array(10).fill(''),\n    numAdmin: Array(10).fill(''),\n    extracto: Array(20).fill(''),\n    clienteSel: '',\n    fechaSel: '',\n    codigo: '',\n    flash: null,\n  };\n\n  goTo(modo, screen) {\n    const extra = {};\n    if (screen === 'solicitud' && !this.state.codigo) extra.codigo = 'DGO-482913';\n    this.setState({ modo, screen, flash: null, ...extra });\n  }\n\n  setUsuario(e) { this.setState({ usuario: e.target.value }); }\n  togglePassword() { this.setState(s => ({ passwordVisible: !s.passwordVisible })); }\n\n  onLogin(e) {\n    e.preventDefault();\n    const esStaff = /admin|super/i.test(this.state.usuario);\n    if (esStaff) this.goTo('staff', 'admin_tablero');\n    else this.goTo('cliente', 'portal');\n  }\n\n  setCasilla(which, idx, raw, total) {\n    const digits = raw.replace(/\\D/g, '').slice(0, 2);\n    this.setState(s => {\n      const arr = s[which].slice();\n      arr[idx] = digits;\n      return { [which]: arr };\n    });\n    if (digits.length === 2 && idx < total - 1) {\n      setTimeout(() => {\n        const el = document.getElementById(which + '-' + (idx + 1));\n        if (el) el.focus();\n      }, 0);\n    }\n  }\n\n  limpiar(which, total) { this.setState({ [which]: Array(total).fill('') }); }\n  setClienteSel(e) { this.setState({ clienteSel: e.target.value }); }\n  setFechaSel(e) { this.setState({ fechaSel: e.target.value }); }\n\n  onGenerarCodigo() {\n    const codigo = 'DGO-' + Math.floor(100000 + Math.random() * 900000);\n    this.setState({ codigo, screen: 'solicitud' });\n  }\n\n  onConfirmarCobro() {\n    this.setState({\n      numAdmin: Array(10).fill(''),\n      clienteSel: '',\n      screen: 'admin_tablero',\n      flash: { text: 'Jugada cargada y cobrada correctamente.' },\n    });\n  }\n\n  onGuardarSorteo() {\n    this.setState({\n      screen: 'admin_tablero',\n      flash: { text: 'Extracto guardado. Cotejo automático: sin ganador esta vez.' },\n    });\n  }\n\n  onCopiar() {\n    try { navigator.clipboard && navigator.clipboard.writeText(this.state.codigo); } catch (err) {}\n    this.setState({ flash: { text: 'Código copiado.' } });\n  }\n\n  noDisponible() {\n    this.setState({ flash: { text: 'Esta pantalla no está incluida en este prototipo.' } });\n  }\n\n  estiloCasilla(value, dup) {\n    const base = \"width:100%;height:60px;padding:12px 0 0;text-align:center;font-family:'Space Grotesk',monospace;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;border-radius:10px;box-sizing:border-box;transition:border-color .12s ease,background-color .12s ease;\";\n    if (dup) return base + 'border:2.5px solid #a52620;background:#fbeae9;color:#a52620;';\n    if (value) return base + 'border:1.5px solid #14663f;background:#e6f1eb;color:#0d4a2d;';\n    return base + 'border:1.5px solid #cbc8bc;background:#fff;color:#10201a;';\n  }\n\n  casillasFor(which, total, checarDup) {\n    const arr = this.state[which];\n    return arr.slice(0, total).map((value, idx) => {\n      const dup = checarDup && value !== '' && arr.filter(v => v === value).length > 1;\n      return {\n        idx, value, id: which + '-' + idx, indice: idx + 1,\n        style: this.estiloCasilla(value, dup),\n        onChange: (e) => this.setCasilla(which, idx, e.target.value, total),\n      };\n    });\n  }\n\n  tableroCells() {\n    const marcados = new Set(this.state.extracto.filter(v => v.length === 2));\n    const cells = [];\n    for (let n = 0; n <= 99; n++) {\n      const label = n < 10 ? '0' + n : '' + n;\n      const marcada = marcados.has(label);\n      cells.push({\n        n, label,\n        style: marcada\n          ? \"aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:3px;background:#14663f;color:#fff;font-family:'Space Grotesk',monospace;font-size:9px;font-weight:700;\"\n          : \"aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:3px;background:#eceae3;color:#8b9a93;font-family:'Space Grotesk',monospace;font-size:9px;font-weight:500;\",\n      });\n    }\n    return cells;\n  }\n\n  navBtnStyle(active, disabled) {\n    let s = 'flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:76px;padding:8px 4px;background:none;border:none;font-weight:600;';\n    if (disabled) return s + 'color:#cbc8bc;';\n    return s + (active ? 'color:#14663f;' : 'color:#8b9a93;');\n  }\n\n  toolbarBtnStyle(active) {\n    let s = 'min-height:30px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid #cbc8bc;cursor:pointer;';\n    return s + (active ? 'background:#14663f;color:#fff;border-color:#14663f;' : 'background:#fff;color:#4b5b54;');\n  }\n\n  renderVals() {\n    const { modo, screen, usuario, passwordVisible, numJugada, numAdmin, extracto, clienteSel, fechaSel, codigo, flash } = this.state;\n\n    const isLogin = screen === 'login';\n    const isClienteScreen = modo === 'cliente' && !isLogin;\n    const isStaffScreen = modo === 'staff';\n\n    const isPortal = isClienteScreen && screen === 'portal';\n    const isJugar = isClienteScreen && screen === 'jugar';\n    const isHistorial = isClienteScreen && screen === 'historial';\n    const isSolicitud = isClienteScreen && screen === 'solicitud';\n\n    const isAdminTablero = isStaffScreen && screen === 'admin_tablero';\n    const isAdminCargar = isStaffScreen && screen === 'admin_cargar';\n    const isAdminSorteo = isStaffScreen && screen === 'admin_sorteo';\n    const isAdminReportes = isStaffScreen && screen === 'admin_reportes';\n\n    const showClienteNav = isClienteScreen && (screen === 'portal' || screen === 'historial');\n    const showStaffNav = isStaffScreen && (screen === 'admin_tablero' || screen === 'admin_reportes');\n    const showAccionJugar = isJugar;\n    const showAccionAdminCargar = isAdminCargar;\n    const showAccionAdminSorteo = isAdminSorteo;\n\n    let scrollPadding = 24;\n    if (showClienteNav || showStaffNav) scrollPadding = 96;\n    if (showAccionJugar || showAccionAdminCargar || showAccionAdminSorteo) scrollPadding = 100;\n    if (isLogin) scrollPadding = 0;\n\n    const contJugada = numJugada.filter(v => v !== '').length;\n    const contAdmin = numAdmin.filter(v => v !== '').length;\n    const contExtracto = extracto.filter(v => v !== '').length;\n\n    const jugadaCompleta = numJugada.every(v => v !== '');\n    const jugadaSinDup = new Set(numJugada).size === numJugada.length;\n    const jugadaListaParaEnviar = jugadaCompleta && jugadaSinDup;\n\n    const adminCompleta = numAdmin.every(v => v !== '');\n    const adminSinDup = new Set(numAdmin).size === numAdmin.length;\n    const confirmarAdminHabilitado = adminCompleta && adminSinDup && clienteSel !== '';\n\n    const extractoListaParaEnviar = extracto.every(v => v !== '');\n\n    const btnHabilitado = 'flex-grow:1;min-height:48px;border-radius:10px;background:#14663f;border:none;color:#fff;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;';\n    const btnDeshabilitado = 'flex-grow:1;min-height:48px;border-radius:10px;background:#cbc8bc;border:none;color:#fff;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;';\n\n    const numsGano = ['03','17','22','29','34','41','58','63','77','89'];\n    const numsJugando = ['05','12','19','26','33','40','47','54','61','68'].map((label, i) => {\n      const salio = i !== 9;\n      return salio\n        ? { label, bg: '#14663f', border: '#14663f', color: '#fff' }\n        : { label, bg: '#fff', border: '#e2e0d8', color: '#8b9a93' };\n    });\n    const numsHistGano = ['08','14','21','30','37','44','52','66',\t'71','95'];\n    const numsHistPerdio = ['02','11','18','25','36','49','57','62','80','93'].map((label, i) => {\n      const salio = i < 7;\n      return salio\n        ? { label, bg: '#14663f', color: '#fff' }\n        : { label, bg: '#eceae3', color: '#4b5b54' };\n    });\n\n    const ultimasJugadas = [\n      { nombre: 'Marcos Ibáñez', hora: 'hoy 18:42', nro: '0128', importe: '$3.000', numeros: ['05','12','19','26','33','40','47','54','61','68'] },\n      { nombre: 'Rosa Paz', hora: 'hoy 17:15', nro: '0094', importe: '$3.000', numeros: ['01','09','15','23','31','39','48','56','64','72'] },\n      { nombre: 'Julio Romero', hora: 'ayer 20:03', nro: '0151', importe: '$3.000', numeros: ['02','10','20','28','35','42','50','58','66','74'] },\n    ];\n\n    const barrasCiclo = [\n      { numero: 47, fechas: '8 al 12 sept.', monto: '$172.000', ancho: '93%', color: '#14663f', jugadas: 86,
